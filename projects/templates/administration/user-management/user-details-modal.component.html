<div frModalPanel size="lg">
  <div frModalHeader>
    <div class="flex items-start gap-4">
      <span frAvatar size="lg" [ngClass]="user.color">
        <span frAvatarFallback>{{ user.initials }}</span>
      </span>
      <div class="grid min-w-0 gap-1">
        <h2 frModalTitle>{{ user.name }}</h2>
        <p frModalDescription>{{ user.email }}</p>
      </div>
    </div>
  </div>

  <div frModalBody>
    <div class="grid gap-3 sm:grid-cols-2">
      <div class="rounded-lg border border-border bg-muted p-3">
        <span class="text-xs uppercase text-muted-foreground">Role</span>
        <strong class="mt-1 flex items-center gap-2 text-foreground">
          <ng-icon name="tablerBriefcase" size="16" />
          {{ user.role }}
        </strong>
      </div>
      <div class="rounded-lg border border-border bg-muted p-3">
        <span class="text-xs uppercase text-muted-foreground">Status</span>
        <span class="mt-1 block">
          <span frBadge [variant]="statusVariant(user.status)">{{ user.status }}</span>
        </span>
      </div>
      <div class="rounded-lg border border-border bg-muted p-3">
        <span class="text-xs uppercase text-muted-foreground">Team</span>
        <strong class="mt-1 flex items-center gap-2 text-foreground">
          <ng-icon name="tablerUsers" size="16" />
          {{ user.team }}
        </strong>
      </div>
      <div class="rounded-lg border border-border bg-muted p-3">
        <span class="text-xs uppercase text-muted-foreground">2F Auth</span>
        <span class="mt-1 block">
          <span frBadge [variant]="user.twoFactor ? 'success' : 'secondary'">
            {{ user.twoFactor ? 'Enabled' : 'Pending' }}
          </span>
        </span>
      </div>
    </div>

    <dl class="mt-4 grid gap-3 text-sm">
      <div class="flex items-center justify-between gap-4 border-b border-border pb-3">
        <dt class="flex items-center gap-2 text-muted-foreground">
          <ng-icon name="tablerClock" size="16" />
          Joined
        </dt>
        <dd class="m-0 font-medium text-foreground">{{ user.joined }}</dd>
      </div>
      <div class="flex items-center justify-between gap-4 border-b border-border pb-3">
        <dt class="flex items-center gap-2 text-muted-foreground">
          <ng-icon name="tablerActivity" size="16" />
          Last seen
        </dt>
        <dd class="m-0 font-medium text-foreground">{{ user.lastSeen }}</dd>
      </div>
      <div class="flex items-center justify-between gap-4">
        <dt class="flex items-center gap-2 text-muted-foreground">
          <ng-icon name="tablerMail" size="16" />
          Email
        </dt>
        <dd class="m-0 truncate font-medium text-foreground">
          <a
            class="underline decoration-border underline-offset-4 hover:text-primary"
            [href]="'mailto:' + user.email"
          >
            {{ user.email }}
          </a>
        </dd>
      </div>
    </dl>
  </div>

  <div frModalFooter>
    <button frButton appearance="outline" type="button" frModalClose>
      <span frButtonLabel>Close</span>
    </button>
  </div>
</div>
